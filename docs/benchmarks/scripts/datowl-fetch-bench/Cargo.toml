# Standalone bench (own workspace, not a member of the Datowl workspace): drives the
# PostgreSQL engine of Datowl (datowl-postgres) exactly as the app does, without the UI.
[package]
name = "datowl-fetch-bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
datowl-domain = { path = "../../../../crates/domain" }
datowl-postgres = { path = "../../../../crates/infrastructure/postgres" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
mimalloc = { version = "0.1", default-features = false }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
