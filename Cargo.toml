[workspace]
resolver = "2"
members = ["crates/domain", "crates/application", "crates/infrastructure/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
datowl-domain = { path = "crates/domain" }
datowl-application = { path = "crates/application" }
datowl-postgres = { path = "crates/infrastructure/postgres" }
datowl-clickhouse = { path = "crates/infrastructure/clickhouse" }
datowl-store = { path = "crates/infrastructure/store" }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dev builds snappy while making the hot paths (row decoding, TSV parsing) fast.
[profile.dev.package."*"]
opt-level = 2
